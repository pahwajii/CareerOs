services:
  - type: web
    name: careeros-omniroute
    runtime: node
    rootDir: omniroute-server
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: HOSTNAME
        value: 0.0.0.0
      - key: DATA_DIR
        value: /opt/render/project/src/omniroute-data
      - key: REQUIRE_API_KEY
        value: "true"
      - key: INITIAL_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_BASE_URL
        fromService:
          type: web
          name: careeros-omniroute
          envVarKey: RENDER_EXTERNAL_URL
    disk:
      name: omniroute-data
      mountPath: /opt/render/project/src/omniroute-data
      sizeGB: 1

  - type: web
    name: careeros-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FORGE_API_KEY
        sync: false
      - key: OMNIROUTE_HOSTPORT
        fromService:
          type: web
          name: careeros-omniroute
          property: hostport
      - key: OMNIROUTE_MODEL
        value: auto
      - key: OMNIROUTE_API_KEY
        sync: false
    healthCheckPath: /api/health
